<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4P2CZM5RLR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4P2CZM5RLR');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA≠DOX // 會議記錄</title>
    <link rel="icon" href="https://i.meee.com.tw/UcseCSf.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020204;
            --text-main: #e0e0e0;
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --font-stack: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 40px 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: var(--font-stack); 
            width: 100%; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 20px;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        .image-container {
            margin: 30px 0;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.2);
            padding: 10px;
            background: rgba(10, 10, 15, 0.8);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: 1.2rem;
            font-family: var(--font-stack);
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* CRT Scanline Effect */
        .crt-scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 9998; opacity: 0.4; }
    </style>
</head>
<body>
    <div class="crt-scanlines"></div>
    
    <div class="container">
        <h1>恭喜你解開密碼！<br>以下是 安特羅迦 留給你的會議記錄，請收好。</h1>
        
        <div class="image-container">
            <img src="https://i.meee.com.tw/EgUouT8.png" alt="會議記錄">
        </div>

        <a href="/" class="btn">回到終端機</a>
    </div>
</body>
</html>
