                name: "瑟思安",
                title: "你的共鳴屬性：【 瑟思安 】",
                image: "https://i.meee.com.tw/IBbpDM3.png",
                description: "分析： 你是一個充滿神秘感、極度不按牌理出牌的個體。你喜歡隱藏自己的真實想法，在別人眼中，你既是個怪人也是個天才。你討厭被世俗的眼光定義，對你來說，逃避現實也是一種高維度的生存策略。只要不打開紙袋，你就永遠無懈可擊。"
            }
        };

        // ==========================================
        // 核心邏輯 (Core Logic)
        // ==========================================
        
        let currentQuestionIndex = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
        let isTyping = false;
        let currentResultName = "";

        // DOM Elements
        const screenWelcome = document.getElementById('screen-welcome');
        const screenQuiz = document.getElementById('screen-quiz');
        const screenLoading = document.getElementById('screen-loading');
        const screenResult = document.getElementById('screen-result');
        
        const progressTextVal = document.getElementById('progress-text-val');
        const progressFillVal = document.getElementById('progress-fill-val');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');

        function switchScreen(screenElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screenElement.classList.add('active');
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
            switchScreen(screenQuiz);
            renderQuestion();
        }

        async function renderQuestion() {
            const currentQ = quizData[currentQuestionIndex];
            const totalQ = quizData.length;
            
            // Update Progress
            progressTextVal.textContent = `${currentQuestionIndex + 1} / ${totalQ}`;
            progressFillVal.style.width = `${((currentQuestionIndex + 1) / totalQ) * 100}%`;

            // Clear options first
            optionsContainer.innerHTML = '';
            questionText.innerHTML = '';

            // Typing Effect for Question
            isTyping = true;
            await typeWriterEffect(questionText, currentQ.question, 30);
            isTyping = false;

            // Shuffle options
            let shuffledOptions = shuffleArray([...currentQ.options]);
            const labels = ["A", "B", "C", "D", "E"];

            // Render Options with slight delay for each
            shuffledOptions.forEach((opt, index) => {
                setTimeout(() => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = `${labels[index]}. ${opt.text}`;
                    btn.onclick = () => selectOption(opt.value, btn);
                    optionsContainer.appendChild(btn);
                }, index * 100); // Staggered entrance
            });
        }

        function typeWriterEffect(element, text, speed) {
            return new Promise(resolve => {
                let i = 0;
                element.innerHTML = '<span class="cursor"></span>';
                
                const timer = setInterval(() => {
                    if (i < text.length) {
                        element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                        i++;
                    } else {
                        clearInterval(timer);
                        element.innerHTML = text; // Remove cursor at the end
                        resolve();
                    }
                }, speed);
            });
        }

        function selectOption(value, btnElement) {
            if (isTyping) return; // Prevent clicking while typing

            // Visual feedback
            document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none'); // Disable all
            btnElement.classList.add('selected');

            // Record score
            if (scores[value] !== undefined) {
                scores[value]++;
            }

            // Next step
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    // Glitch transition effect
                    screenQuiz.style.opacity = '0.5';
                    screenQuiz.style.transform = 'translateX(-10px)';
                    setTimeout(() => {
                        screenQuiz.style.opacity = '1';
                        screenQuiz.style.transform = 'translateX(0)';
                        renderQuestion();
                    }, 150);
                } else {
                    calculateAndShowResult();
                }
            }, 500); // 0.5s delay as requested
        }

        function calculateAndShowResult() {
            switchScreen(screenLoading);

            setTimeout(() => {
                // Find highest score
                let maxScore = -1;
                let topChoices = [];

                for (const [key, value] of Object.entries(scores)) {
                    if (value > maxScore) {
                        maxScore = value;
                        topChoices = [key];
                    } else if (value === maxScore) {
                        topChoices.push(key); // Tie
                    }
                }

                // Randomly pick one if tie
                const finalChoice = topChoices[Math.floor(Math.random() * topChoices.length)];
                const result = resultData[finalChoice];
                currentResultName = result.name;

                // Render Result
                document.getElementById('result-title').textContent = result.title;
                document.getElementById('result-image').src = result.image;
                document.getElementById('result-desc').innerHTML = result.description.replace(/\n/g, '<br><br>');

                switchScreen(screenResult);
            }, 2000); // 2 seconds fake loading
        }

        function restartQuiz() {
            startQuiz();
        }

        function shareToX() {
            const text = `【 PARA≠DOX 】經過系統的高維度掃描，我的實體共鳴結果是：「 ${currentResultName} 」。看來我早就陷入了不可觀察的量子疊加態了……你的碳基大腦又會與哪個悖論產生共鳴？快來同步測試！`;
            const url = window.location.href;
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
            window.open(twitterUrl, '_blank');
        }
    </script>
</body>
</html>
