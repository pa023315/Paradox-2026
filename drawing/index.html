<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARA≠DOX // 薛丁格的每日觀察盲盒</title>
    <link rel="icon" href="https://i.meee.com.tw/UcseCSf.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --neon-green: #00ff66;
            --bg-color: #050505;
            --text-color: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 40px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        h1 {
            color: var(--neon-blue);
            font-size: 1.8rem;
            margin-bottom: 90px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        /* CSS Box */
        .box-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 50px auto;
            perspective: 800px;
            z-index: 10;
        }

        .css-box {
            width: 100%;
            height: 100%;
            background-color: #8b5a2b;
            border: 2px solid var(--neon-blue);
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(0, 243, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .css-box::before, .css-box::after {
            content: '';
            position: absolute;
            width: 49%;
            height: 30px;
            background-color: #a06b35;
            border: 2px solid var(--neon-blue);
            border-bottom: none;
            top: -32px;
            z-index: 3;
            transition: all 0.5s ease;
        }

        .css-box::before {
            left: -2px;
            transform-origin: bottom left;
            transform: skewX(-20deg);
        }

        .css-box::after {
            right: -2px;
            transform-origin: bottom right;
            transform: skewX(20deg);
        }

        .css-box .tape {
            position: absolute;
            width: 30px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            left: 50%;
            transform: translateX(-50%);
            border-left: 1px dashed var(--neon-blue);
            border-right: 1px dashed var(--neon-blue);
            z-index: 4;
            transition: opacity 0.3s;
        }

        .css-box .schrodinger-logo {
            font-size: 40px;
            opacity: 0.5;
            filter: grayscale(100%) sepia(100%) hue-rotate(180deg);
        }

        /* Open state */
        .box-wrapper.open .css-box::before {
            transform: skewX(-40deg) rotate(-20deg);
            background-color: #7a4e25;
        }
        .box-wrapper.open .css-box::after {
            transform: skewX(40deg) rotate(20deg);
            background-color: #7a4e25;
        }
        .box-wrapper.open .tape {
            opacity: 0;
        }
        .box-wrapper.open .item {
            display: block;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .item {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            z-index: 20;
            text-shadow: 0 0 20px var(--neon-purple);
        }

        .item img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
        }

        @keyframes popUp {
            0% { top: 20px; opacity: 0; transform: translateX(-50%) scale(0.5); }
            50% { opacity: 1; }
            100% { top: -20px; opacity: 1; transform: translateX(-50%) scale(1); }
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-2deg); }
            20% { transform: translate(-3px, 0px) rotate(2deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(2deg); }
            50% { transform: translate(-1px, 2px) rotate(-2deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-2deg); }
            80% { transform: translate(-1px, -1px) rotate(2deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-2deg); }
        }

        .shaking {
            animation: shake 0.1s infinite;
            box-shadow: 0 0 30px var(--neon-red) !important;
            border-color: var(--neon-red) !important;
        }
        .shaking::before, .shaking::after {
            border-color: var(--neon-red) !important;
        }
        .shaking .tape {
            border-color: var(--neon-red) !important;
        }

        /* Button */
        .btn {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            margin-top: 30px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .btn:disabled {
            color: #555;
            border-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-purple {
            color: var(--neon-purple);
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.2);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-purple:hover:not(:disabled) {
            background: rgba(188, 19, 254, 0.1);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.5);
            text-shadow: 0 0 5px var(--neon-purple);
        }

        /* Text Area */
        .text-display {
            min-height: 80px;
            font-size: 1rem;
            line-height: 1.6;
            color: #aaa;
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .text-display.blinking-red {
            color: var(--neon-red);
            border-color: var(--neon-red);
            animation: blinkText 0.5s infinite alternate;
        }

        @keyframes blinkText {
            from { text-shadow: 0 0 5px var(--neon-red); opacity: 1; }
            to { text-shadow: 0 0 20px var(--neon-red); opacity: 0.7; }
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: currentColor;
            margin-left: 5px;
            animation: blinkCursor 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Result Display */
        .result-area {
            display: none;
            margin-top: 20px;
            animation: fadeIn 1s ease forwards;
        }

        .result-status {
            font-size: 1.5rem;
            color: var(--neon-purple);
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(188, 19, 254, 0.5);
        }

        .result-title {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-bottom: 15px;
        }

        .result-desc {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.6;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Back to terminal */
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            z-index: 1000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
        }

        /* Decorative UI Background */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 999;
            opacity: 0.15;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, rgba(188, 19, 254, 0.02) 40%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        .deco-corner {
            position: fixed;
            width: 100px;
            height: 100px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        .deco-top-right {
            top: 40px;
            right: 40px;
            border-top: 2px solid var(--neon-purple);
            border-right: 2px solid var(--neon-purple);
        }

        .deco-bottom-left {
            bottom: 40px;
            left: 40px;
            border-bottom: 2px solid var(--neon-purple);
            border-left: 2px solid var(--neon-purple);
        }

        .tech-data {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-family: inherit;
            font-size: 11px;
            color: rgba(0, 243, 255, 0.2);
            pointer-events: none;
            z-index: 0;
            line-height: 2.2;
            letter-spacing: 1px;
            animation: textFlicker 6s infinite alternate;
        }

        .tech-data-left {
            left: 40px;
            text-align: left;
        }

        .tech-data-right {
            right: 40px;
            text-align: right;
        }

        @keyframes textFlicker {
            0%, 94%, 100% { opacity: 1; }
            95%, 97% { opacity: 0.3; }
            96%, 98% { opacity: 0.8; }
        }

        @media (max-width: 900px) {
            .deco-corner, .tech-data {
                display: none;
            }
        }
    </style>
</head>

            { status: "疊加態", title: "社交薛丁格", desc: "受瑟思安的電波影響，您今天同時處於『想出門玩』與『想賴在床上』的完美疊加態。只要沒人強迫您做決定，您就可以套著紙袋一直裝死。" },
            { status: "末吉", title: "快取意外清空", desc: "您今天有極高的機率會發生『走進房間卻忘記要拿什麼』的錯誤。這不是初老，只是蕾忒船長不小心路過並清空了您的短期快取記憶。請退回上一個房間重新載入。" },
            { status: "大凶", title: "高熵會議地獄", desc: "警告！安特羅迦剛剛『優化』了您的行事曆。您今天可能會遭遇各種突發的無意義討論、被插隊的工作，或是主管的臨時差遣。請準備好精神護盾。" },
            { status: "大吉", title: "物理亂數爆擊", desc: "今日您的物理亂數表表現極其優異。無論是遠距離投擲垃圾進垃圾桶，還是隨手盲猜密碼，都有極高機率觸發『爆擊』。請享受這突如其來的高光時刻。" },
            { status: "中吉", title: "背景無聲更新", desc: "您今天可能會覺得有點莫名疲倦。別擔心，這不是生病，而是您的碳基載體正在進行宇宙背景的靜默更新。多喝點水，讓進度條跑完就好。" },
            { status: "小吉", title: "安全模式啟動", desc: "系統偵測到您的精神力偏低，已自動為您切換至『安全模式』。今日適合進行最低限度的維生操作，不要給自己排太多行程，適度摸魚是合法的。" },
            { status: "凶", title: "防毒軟體焦慮", desc: "您今天會一直覺得『好像忘了做什麼事』，就像防毒軟體一直在背景狂轉卻掃不出 Bug。別想了，就算真的忘了，明天再修復這個漏洞吧。" },
            { status: "蛤", title: "材質載入失敗", desc: "您打開盲盒，發現裡面只有一塊寫著『Error』的紫黑相間破圖方塊。系統建議您今天吃東西時不要太在意口感，因為物理引擎的味覺材質包似乎還沒下載完畢。" }
        ];

        const btn = document.getElementById('action-btn');
        const boxWrapper = document.getElementById('box-wrapper');
        const cssBox = document.getElementById('css-box');
        const textDisplay = document.getElementById('text-display');
        const typewriterText = document.getElementById('typewriter-text');
        const resultArea = document.getElementById('result-area');
        const resultStatus = document.getElementById('result-status');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const boxItem = document.getElementById('box-item');

        let isObserving = false;
        let hasCollapsed = false;
        let typeInterval;

        // Typewriter effect function
        function typeText(text, speed = 50, callback = null) {
            clearInterval(typeInterval);
            typewriterText.textContent = '';
            let i = 0;
            typeInterval = setInterval(() => {
                if (i < text.length) {
                    typewriterText.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeInterval);
                    if (callback) callback();
                }
            }, speed);
        }

        // Initialize state
        function init() {
            isObserving = false;
            hasCollapsed = false;
            
            // Reset UI
            btn.textContent = '[ 進行今日觀察 ]';
            btn.disabled = false;
            document.getElementById('share-x-btn').style.display = 'none';
            boxWrapper.classList.remove('open');
            cssBox.classList.remove('shaking');
            textDisplay.classList.remove('blinking-red');
            textDisplay.style.display = 'block';
            resultArea.style.display = 'none';
            // Keep the image inside the box item
            boxItem.innerHTML = '<img src="https://storage.googleapis.com/macha-agent-studio-prod-user-content/2025-02-19/image_1739933069177.png" alt="item">';
            
            typeText("系統待機中... 箱子內目前處於未定義的疊加態。");
        }

        // Start observation
        function startObservation() {
            if (isObserving) return;
            
            if (hasCollapsed) {
                init();
                return;
            }

            isObserving = true;
            btn.disabled = true;
            
            // Start animation
            cssBox.classList.add('shaking');
            textDisplay.classList.add('blinking-red');
            typewriterText.textContent = "波函數坍縮中... 正在運算高維度機率...";
            clearInterval(typeInterval); // Stop any ongoing typing

            // Wait for 2.5 seconds
            setTimeout(() => {
                collapseWaveFunction();
            }, 2500);
        }

        // Collapse and show result
        function collapseWaveFunction() {
            cssBox.classList.remove('shaking');
            textDisplay.classList.remove('blinking-red');
            textDisplay.style.display = 'none';
            
            // Pick random fortune
            const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
            
            // Update result UI
            resultStatus.textContent = `[ ${fortune.status} ]`;
            resultTitle.textContent = fortune.title;
            resultDesc.textContent = fortune.desc;
            
            // Custom icons based on status and title
            const imageMap = {
                "404_好運找不到": "https://i.meee.com.tw/caaUEN7.png",
                "大凶_系統全面熔毀": "https://i.meee.com.tw/7T5nWje.png",
                "大凶_高熵會議地獄": "https://i.meee.com.tw/R4Ygtvq.png",
                "大凶_硬體物理性損毀": "https://i.meee.com.tw/amG1L4m.png",
                "大吉_拉普拉斯的綠燈": "https://i.meee.com.tw/f5kaNX3.png",
                "大吉_物理亂數爆擊": "https://i.meee.com.tw/X5WnS49.png",
                "大吉_網路延遲歸零": "https://i.meee.com.tw/gqrPcKj.png",
                "小凶_芝諾的載入中": "https://i.meee.com.tw/TOm9Pc1.png",
                "小吉_安全模式啟動": "https://i.meee.com.tw/OAMZ52C.png",
                "小吉_完美的咖啡乳化": "https://i.meee.com.tw/X6JmCir.png",
                "中吉_背景無聲更新": "https://i.meee.com.tw/OdFiUF4.png",
                "中吉_熵值異常低落": "https://i.meee.com.tw/owfrMeJ.png",
                "凶_防毒軟體焦慮": "https://i.meee.com.tw/9WemSY1.png",
                "凶_高熵值的混亂入侵": "https://i.meee.com.tw/zAGjvhu.png",
                "末吉_快取意外清空": "https://i.meee.com.tw/gzF6XAb.png",
                "末吉_記憶體緩衝中": "https://i.meee.com.tw/nrYmNak.png",
                "格式化_空無一物": "https://i.meee.com.tw/uC9XEtN.png",
                "蛤_未定義的命運": "https://i.meee.com.tw/XeULIrW.png",
                "疊加態_拒絕坍縮": "https://i.meee.com.tw/tPKtb9y.png",
                "疊加態_社交薛丁格": "https://i.meee.com.tw/JPyIbxe.png",
                "大吉_絕對秩序與算力加持": "https://i.meee.com.tw/vnpLEoM.png",
                "小凶_輸入法延遲": "https://i.meee.com.tw/Hyj3ZQE.png",
                "小凶_邊緣碰撞偵測失效": "https://i.meee.com.tw/ItUyfgo.png",
                "小吉_微小的封包同步": "https://i.meee.com.tw/DFywaRC.png",
                "中吉_穩定連線的日常": "https://i.meee.com.tw/v7Oochs.png",
                "凶_CSS 樣式表崩潰": "https://i.meee.com.tw/E0RI2kf.png",
                "末吉_芝諾式的延遲好運": "https://i.meee.com.tw/G1bNVsA.png",
                "活死魚_腥味預警": "https://i.meee.com.tw/ognSgQH.png",
                "紙袋_隱藏的躲避": "https://i.meee.com.tw/mDNk1UH.png",
                "蛤_材質載入失敗": "https://i.meee.com.tw/Ah8MbBa.png"
            };
            
            const key = `${fortune.status}_${fortune.title}`;
            const imgUrl = imageMap[key] || "https://storage.googleapis.com/macha-agent-studio-prod-user-content/2025-02-19/image_1739933069177.png";
            boxItem.innerHTML = `<img src="${imgUrl}" alt="${fortune.status}">`;

            // Open box
            boxWrapper.classList.add('open');
            resultArea.style.display = 'block';
            
            // Update button
            btn.textContent = '[ 重新啟動觀察儀器 ]';
            btn.disabled = false;
            
            // Update and show Share to X button
            const shareBtn = document.getElementById('share-x-btn');
            const tweetText = `我的今日運勢坍縮為：【${fortune.status} - ${fortune.title}】！\n「${fortune.desc}」\n你的實體狀態今天還穩定嗎？快來打開你的薛丁格盲盒 \n\n#paradox5th\n\nhttps://paradox-sf.tw/drawing/`;
            shareBtn.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
            shareBtn.style.display = 'inline-block';
            
            isObserving = false;
            hasCollapsed = true;
        }

        // Start initial typing
        window.onload = init;

    </script>
</body>
</html>
