<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智者情緣：悖論的交會點</title>
    <style>
        :root {
            --term-green: #39ff14;
            --bg-dark: #111111;
            --ui-bg: rgba(10, 10, 10, 0.7);
            --ui-border: rgba(57, 255, 20, 0.4);
            --text-main: #f0f0f0;
            --highlight: #39ff14;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
        }

        .mono {
            font-family: 'Courier New', Consolas, monospace;
        }

        h1, h2, h3, h4 {
            font-weight: 300;
            letter-spacing: 2px;
        }

        .text-highlight {
            color: var(--highlight);
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at center, transparent 0%, var(--bg-dark) 100%),
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .view.hidden {
            display: none !important;
        }

        /* 按鈕共用樣式 */
        .btn {
            background-color: var(--ui-bg);
            color: var(--highlight);
            border: 1px solid var(--ui-border);
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            outline: none;
        }

        .btn:hover {
            background-color: rgba(57, 255, 20, 0.1);
            border-color: var(--term-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            text-shadow: 0 0 5px var(--term-green);
        }

        /* 視圖 1：標題畫面 */
        #view-title {
            background: radial-gradient(circle at 50% 50%, #050a15 0%, #000000 100%);
            position: relative;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 底層：動態網格 */
        #view-title::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* 底層：極強暗角 */
        #view-title::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 300px rgba(0,0,0,1);
            pointer-events: none;
            z-index: 3;
        }

        /* 呼吸光斑 */
        .aurora-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            filter: blur(100px);
            transform: translate(-50%, -50%);
            animation: breathe 12s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; background: radial-gradient(circle, rgba(10, 30, 60, 0.2) 0%, transparent 60%); }
            100% { transform: translate(-45%, -55%) scale(1.1); opacity: 0.8; background: radial-gradient(circle, rgba(57, 255, 20, 0.15) 0%, transparent 70%); }
        }

        @keyframes fade-in-out {
            0% { opacity: 1; filter: brightness(1) contrast(1); }
            50% { opacity: 0; filter: brightness(0.2) contrast(1.5); }
            100% { opacity: 1; filter: brightness(1) contrast(1); }
        }

        /* 全息浮動公式 */
        .hologram-math {
            position: absolute;
            font-family: "MingLiU", "PMingLiU", serif;
            font-size: 2.5rem;
            color: rgba(57, 255, 20, 0.35);
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
            z-index: 4;
            pointer-events: none;
            animation: floatMath 20s linear infinite;
            white-space: nowrap;
        }

        @keyframes floatMath {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; transform: translateY(-30px) rotate(5deg); }
            100% { transform: translateY(-50px) rotate(10deg); opacity: 0; }
        }

        /* Canvas 粒子流 */
        #bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .title-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        #view-title h1 {
            font-size: 4rem;
            font-weight: 300;
            margin: 0 0 15px 0;
            color: var(--text-main);
            letter-spacing: 0.2em;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3), 0 0 30px rgba(100, 255, 255, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5em;
        }
        


        .menu-container {
            position: absolute;
            bottom: 15%;
            right: 15%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .system-ready {
            font-size: 12px;
            color: var(--highlight);
            margin-bottom: 20px;
            letter-spacing: 0.2em;
            animation: blink 2s infinite;
            opacity: 0.6;
            cursor: pointer;
            user-select: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-5px, 5px) }
            40% { transform: translate(-5px, -5px) }
            60% { transform: translate(5px, 5px) }
            80% { transform: translate(5px, -5px) }
            100% { transform: translate(0) }
        }

        .title-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
        }

        .title-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 10px 0;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            outline: none;
            letter-spacing: 0.1em;
        }

        .title-btn small {
            font-size: 0.9rem;
            margin-left: 15px;
            opacity: 0.5;
            font-family: system-ui, sans-serif;
            letter-spacing: 0.2em;
        }

        .btn-indicator {
            content: '';
            display: inline-block;
            width: 3px;
            height: 0;
            background-color: var(--highlight);
            margin-right: 0;
            transition: all 0.3s ease;
            opacity: 0;
            box-shadow: 0 0 10px var(--highlight);
        }

        .title-btn:hover {
            color: var(--text-main);
            transform: translateX(10px);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .title-btn:hover .btn-indicator {
            height: 1.2em;
            margin-right: 15px;
            opacity: 1;
        }

        /* 視圖 2：角色介紹頁面 (現代 ACG 風格) */
        #view-intel {
            padding: 0;
            align-items: stretch;
            flex-direction: row;
        }

        .intel-glass-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .intel-watermark {
            position: absolute;
            bottom: -5%;
            right: -5%;
            font-size: 15rem;
            color: rgba(255, 255, 255, 0.05);
            font-weight: 900;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 0.1em;
            line-height: 1;
            user-select: none;
        }

        .return-btn-container {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 20;
        }

        .return-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .return-btn:hover {
            color: var(--highlight);
            transform: translateX(-10px);
            text-shadow: 0 0 10px var(--highlight);
        }

        .intel-sidebar {
            width: 25%;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 0 80px 40px;
            z-index: 10;
        }

        .intel-nav-item {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            padding: 20px 20px 20px 40px;
            text-align: left;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            letter-spacing: 2px;
            margin-bottom: 5px;
            outline: none;
        }

        .intel-nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .intel-nav-item:hover, .intel-nav-item.active {
            color: #ffffff;
            transform: translateX(10px);
            font-weight: bold;
            background: linear-gradient(90deg, rgba(57, 255, 20, 0.1) 0%, transparent 100%);
        }

        .intel-nav-item:hover::before, .intel-nav-item.active::before {
            background: var(--highlight);
            box-shadow: 0 0 15px var(--highlight);
            width: 5px;
        }

        .intel-content {
            flex: 1;
            position: relative;
            display: flex;
            z-index: 5;
            flex-direction: row;
        }

        .intel-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 60px;
            max-width: 600px;
            z-index: 10;
        }
        
        .intel-detail-placeholder {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.3);
            font-style: italic;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .intel-entity {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3em;
            margin-bottom: 20px;
        }

        .intel-info h2 {
            font-size: 4rem;
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
            font-weight: bold;
        }

        .intel-info h4 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--highlight);
            letter-spacing: 0.2em;
        }

        .intel-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, var(--highlight) 0%, transparent 100%);
            margin: 30px 0;
            position: relative;
        }
        
        .intel-divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: -2px;
            width: 5px;
            height: 5px;
            background: var(--highlight);
            box-shadow: 0 0 10px var(--highlight);
        }

        .intel-info p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #cccccc;
        }

        .character-portrait-placeholder {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            box-shadow: inset 50px 0 100px rgba(0,0,0,0.5);
        }

        .portrait-text {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.05);
            letter-spacing: 0.3em;
            transform: rotate(-90deg);
            white-space: nowrap;
            font-weight: 900;
        }

        /* 視圖 3：主要遊戲畫面 */
        #view-game {
            position: relative;
        }

        /* 頂部狀態列 */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: var(--ui-bg);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--ui-border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            z-index: 20;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .stat-name {
            color: #ccc;
        }

        .stat-track {
            width: 60px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .stat-fill {
            position: absolute;
            top: -1px;
            left: 0;
            height: 4px;
            width: 0%;
            background: var(--highlight);
            box-shadow: 0 0 8px var(--highlight);
            transition: width 0.4s ease;
        }

        /* 中央立繪區 */
        #sprite-area {
            position: absolute;
            bottom: 25%; /* 貼齊對話框上方 */
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 60%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none; /* 避免擋住點擊 */
            /* 讓底部與對話框融合的漸層 */
            mask-image: linear-gradient(to top, transparent 0%, black 15%);
            -webkit-mask-image: linear-gradient(to top, transparent 0%, black 15%);
        }

        .sprite-placeholder {
            width: 400px;
            height: 100%;
            max-height: 80vh;
            background: linear-gradient(to top, rgba(255,255,255,0.05), transparent);
            border: 1px dashed rgba(255,255,255,0.1);
            border-bottom: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.3);
            font-size: 1.2rem;
            border-radius: 20px 20px 0 0;
        }

        /* 底部對話區 */
        #bottom-dialog {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--ui-border);
            padding: 40px 60px;
            box-sizing: border-box;
            z-index: 20;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #name-tag {
            position: absolute;
            top: -20px;
            left: 40px;
            background: var(--bg-dark);
            border: 1px solid var(--ui-border);
            color: var(--highlight);
            padding: 5px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        #text-box {
            font-size: 1.2rem;
            line-height: 1.8;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        /* 選項區 */
        #choices-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 30;
            width: 80%;
            max-width: 600px;
        }

        .choice-btn {
            background: var(--ui-bg);
            color: var(--text-main);
            border: 1px solid var(--ui-border);
            padding: 15px 30px;
            font-size: 1.1rem;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .choice-btn:hover {
            color: var(--bg-dark);
            background: var(--highlight);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
        }

        /* 結局層 */
        #view-end {
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            z-index: 100;
            text-align: center;
            padding: 40px;
        }

        .end-content {
            background: var(--ui-bg);
            border: 1px solid var(--ui-border);
            padding: 60px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 800px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
        }

        /* 成就卡片樣式 */
        .achievement-card {
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 30px;
            margin-bottom: 20px;
            background: rgba(10, 10, 15, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .achievement-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .achievement-card.unlocked {
            border-color: rgba(57, 255, 20, 0.3);
            background: rgba(57, 255, 20, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.05);
        }

        .achievement-card.unlocked::before {
            background: var(--highlight);
            box-shadow: 0 0 15px var(--highlight);
        }

        .achievement-icon {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 30px;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .achievement-card.unlocked .achievement-icon {
            color: var(--highlight);
            text-shadow: 0 0 15px var(--highlight);
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-title {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .achievement-card.unlocked .achievement-title {
            color: var(--highlight);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .achievement-desc {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.2);
            margin: 0;
            line-height: 1.6;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .achievement-card.unlocked .achievement-desc {
            color: #cccccc;
        }

        /* 響應式 */
        @media (max-width: 768px) {
            #view-title h1 { font-size: 1.8rem; letter-spacing: 0.1em; width: 100%; padding: 0 10px; }
            .subtitle { font-size: 0.7rem; letter-spacing: 0.2em; margin-top: 10px; }

            .menu-container { right: auto; left: 50%; transform: translateX(-50%); bottom: 12%; align-items: center; width: 100%; }
            .title-actions { align-items: center; width: 100%; }
            .title-actions .btn-indicator { display: none; }
            .title-btn { font-size: 1.2rem; justify-content: center; width: 80%; }
            .title-btn .btn-en { display: none; }
            .title-btn small { font-size: 1.2rem; margin-left: 0; opacity: 1; letter-spacing: 0.2em; padding: 10px 0; }
            .title-btn:hover { transform: translateX(0) scale(1.05); }
            .title-btn:hover .btn-indicator { display: none; }
            .hologram-math { font-size: 1.2rem !important; opacity: 0.3 !important; }
            #view-intel { padding: 0; overflow: hidden; }
            .intel-glass-container { flex-direction: column; overflow-y: auto; }
            .intel-sidebar { width: 100%; min-width: auto; padding: 100px 20px 20px 20px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .intel-content { flex-direction: column; justify-content: flex-start; }
            .intel-info { flex: none; padding: 30px 20px; max-width: 100%; justify-content: flex-start; text-align: left; }
            .intel-info h2 { font-size: 2.2rem; margin-top: 10px; }
            .intel-info h4 { font-size: 1.2rem; margin-top: 10px; }
            .intel-info p { font-size: 1.2rem; line-height: 1.7; margin-top: 20px; word-break: keep-all; }
            .intel-divider { margin: 20px 0; }
            .character-portrait-placeholder { display: none; }
            .portrait-text { display: none; }
            
            .achievement-header { width: 100% !important; padding: 80px 20px 20px 20px !important; text-align: center; align-items: center; }
            .achievement-header h1 { font-size: 2.5rem !important; word-break: keep-all; white-space: nowrap; }
            .achievement-list-container { width: 100% !important; padding: 20px !important; }
            
            #bottom-dialog { height: 35%; padding: 30px 20px; }
            #view-end { padding: 20px; box-sizing: border-box; }
            .end-content { padding: 30px 15px; width: 100%; max-width: 100%; box-sizing: border-box; }
            #end-message { text-align: center; overflow-wrap: break-word; word-break: break-all; }
            #end-message h2 { font-size: 1.3rem !important; margin-bottom: 10px !important; letter-spacing: 1px !important; word-wrap: break-word; white-space: normal; line-height: 1.4; }
            #end-message p { font-size: 0.95rem !important; margin: 10px 0; word-break: normal; overflow-wrap: break-word; line-height: 1.6 !important; }

        function renderTopBar() {
            const topBar = document.getElementById('top-bar');
            topBar.innerHTML = '';
            
            // 設定最大滿意度，讓進度條能夠動態反映狀態
            const MAX_VAL = 4; 

            Object.keys(satisfactions).forEach(key => {
                const val = satisfactions[key];
                const name = characterData[key].name;

                if(val < 0) percent = 0; 
                
                const statHTML = `
                    <div class="stat-item mono">
                        <span class="stat-name">${name}</span>
                        <div class="stat-track">
                            <div class="stat-fill" style="width: ${percent}%;"></div>
                        </div>
                    </div>
                `;
                topBar.innerHTML += statHTML;
            });
        }

        // 保留原汁原味的打字機，支援 HTML 標籤瞬間插入
        function playSimpleTypewriter(element, text, onComplete) {
            clearInterval(typeWriterInterval);
            element.innerHTML = '';
            isTyping = true;
            let i = 0;
            let accumulatedHTML = "";
            let processedText = text.replace(/拉普拉斯|馬克斯威爾|芝諾|薛丁格|普魯塔克|決定論|熱力學第二定律|妖精|量子/g, match => `<span class="text-highlight">${match}</span>`);

            // 定義跳過打字的函數
            skipTypewriter = () => {
                if (isTyping) {
                    clearInterval(typeWriterInterval);
                    element.innerHTML = processedText;
                    isTyping = false;
                    
                    // 使 text-box 滾動到最底部
                    if (element.id === 'text-box') {
                        element.scrollTop = element.scrollHeight;
                    }
                    
                    if (onComplete) {
                        onComplete();
                    }
                }
            };

            typeWriterInterval = setInterval(() => {
                if (i < processedText.length) {
                    if (processedText.charAt(i) === '<') {
                        let endIdx = processedText.indexOf('>', i);
                        if (endIdx !== -1) {
                            accumulatedHTML += processedText.substring(i, endIdx + 1);
                            i = endIdx + 1;
                        } else {
                            accumulatedHTML += processedText.charAt(i);
                            i++;
                        }
                    } else {
                        accumulatedHTML += processedText.charAt(i);
                        i++;
                    }
                    element.innerHTML = accumulatedHTML;
                    
                    // 自動滾動到最底
                    if (element.id === 'text-box') {
                        element.scrollTop = element.scrollHeight;
                    }
                } else {
                    clearInterval(typeWriterInterval);
                    isTyping = false;
                    if(onComplete) onComplete();
                }
            }, 40); // 打字速度
        }

        function loadScene(sceneId) {
            if (sceneId === "end" || sceneId === "end_check" || sceneId === "system_romance_end" || (typeof sceneId === 'string' && sceneId.startsWith("ending_"))) {
                handleEnding(sceneId);
                return;
            }

            const scene = storyScript[sceneId];
            if (!scene) return;
            
            if (scene.onEnter) {
                scene.onEnter();
            }

            const nameTag = document.getElementById('name-tag');
            const textBox = document.getElementById('text-box');
            const choicesArea = document.getElementById('choices-area');
            const spriteImg = document.getElementById('sprite-img');

            nameTag.textContent = scene.speaker;
            choicesArea.innerHTML = ''; // 隱藏選項，等待文字打完
            
            // 設定立繪
            const imageMap = {
                "拉普拉斯": "https://i.meee.com.tw/7zU8tKW.gif",
                "馬克斯威爾": "https://i.meee.com.tw/c0C1AOn.gif",
                "普魯塔克": "https://i.meee.com.tw/bEzZQ9w.gif",
                "芝諾": "https://i.meee.com.tw/9gYjlt2.gif",
                "薛丁格": "https://i.meee.com.tw/Mc3EmKC.gif"
            };

            const characterImageUrl = imageMap[scene.speaker];
            
            if (characterImageUrl) {
                spriteImg.innerHTML = `<img src="${characterImageUrl}" style="width:100%; height:100%; object-fit:contain; border: none; background: transparent; pointer-events: none;" />`;
                spriteImg.style.display = 'flex';
                spriteImg.style.border = 'none';
                spriteImg.style.background = 'transparent';
                spriteImg.style.justifyContent = 'center';
                spriteImg.style.alignItems = 'flex-end';
            } else if (scene.imagePlaceholder) {
                spriteImg.innerHTML = `[ ${scene.imagePlaceholder} ]`;
                spriteImg.style.display = 'flex';
                spriteImg.style.border = '1px dashed rgba(255,255,255,0.1)';
                spriteImg.style.background = 'linear-gradient(to top, rgba(255,255,255,0.05), transparent)';
            } else {
                spriteImg.style.display = 'none';
            }

            playSimpleTypewriter(textBox, scene.text.replace(/\{playerName\}/g, playerName), () => {
                // 文字打完後生成選項
                const shuffledChoices = [...scene.choices];
                for (let i = shuffledChoices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledChoices[i], shuffledChoices[j]] = [shuffledChoices[j], shuffledChoices[i]];
                }
                shuffledChoices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'btn choice-btn';
                    btn.innerHTML = `> ${choice.text.replace(/\{playerName\}/g, playerName)}`;
                    btn.onclick = () => {
                        if (isTyping) return; // 避免打字過程中觸發
                        
                        // 處理滿意度更動
                        if (choice.eId && _mDist[choice.eId]) {
                            const eStr = atob(_mDist[choice.eId]);
                            eStr.split(',').forEach(pair => {
                                const parts = pair.split(':');
                                if (parts.length === 2 && satisfactions[parts[0]] !== undefined) {
                                    satisfactions[parts[0]] += parseInt(parts[1], 10);
                                }
                            });
                            renderTopBar(); // 更新狀態列
                        } else if (choice.effects) {
                            Object.keys(choice.effects).forEach(key => {
                                satisfactions[key] += choice.effects[key];
                            });
                            renderTopBar();
                        }
                        
                        if (choice.reaction) {
                            // 顯示表情與台詞反饋
                            choicesArea.innerHTML = ''; // 清除舊選項
                            playSimpleTypewriter(textBox, choice.reaction.replace(/\{playerName\}/g, playerName), () => {
                                const continueBtn = document.createElement('button');
                                continueBtn.className = 'btn choice-btn';
                                continueBtn.innerHTML = `> [ 點擊以繼續 ]`;
                                continueBtn.onclick = () => {
                                    loadScene(choice.nextScene);
                                };
                                choicesArea.appendChild(continueBtn);
                            });
                        } else {
                            // 直接切換場景
                            loadScene(choice.nextScene);
                        }
                    };
                    choicesArea.appendChild(btn);
                });
            });
        }

            const ctx = canvas.getContext('2d');
            
            // 處理 Retina 螢幕解析度
            const dpr = window.devicePixelRatio || 1;
            
            let width, height;
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resize);
            resize();

            const particles = [];
            const particleCount = 70;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    vx: 0,
                    vy: -Math.random() * 0.4 - 0.1,
                    phase: Math.random() * Math.PI * 2,
                    amp: Math.random() * 0.4,
                    opacity: Math.random() * 0.6 + 0.1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += Math.sin(p.phase) * p.amp;
                    p.phase += 0.01;

                    if (p.y < -10) {
                        p.y = height + 10;
                        p.x = Math.random() * width;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(100, 255, 200, ${p.opacity})`;
                    ctx.fill();
                });

                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        }

        // -- Meta 彩蛋 --
        let systemClickCount = 0;
        document.addEventListener('DOMContentLoaded', () => {
            const sysReady = document.getElementById('system-ready-text');
            if (sysReady) {
                sysReady.addEventListener('click', () => {
                    systemClickCount++;
                    if (systemClickCount >= 5) {
                        systemClickCount = 0;
                        triggerSystemEasterEgg();
                    }
                });
            }
        });

        function triggerSystemEasterEgg() {
            unlockAchievement('metaRomance');
            document.body.style.animation = "glitch-anim 0.3s steps(2, end) 3";
            setTimeout(() => {
                document.body.style.animation = "";
                document.getElementById('view-game').style.backgroundColor = "black";
                document.getElementById('text-box').style.color = "red";
                startGame('system_romance_start');
            }, 900);
        }

        function returnToTitle() {
            showTitle();
        }

        function showToast(msg) {
            const toast = document.getElementById('custom-toast');
            if (!toast) return;
            toast.innerHTML = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 初始化
        window.onload = showTitle;
    </script>
</body>
</html>
